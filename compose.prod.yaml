services:
  mysql:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  cms:
    build:
      target: prod
    restart: unless-stopped
    volumes:
      - cms_public:/var/www/html/public
      - cms_storage:/var/www/html/storage

  nginx:
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - cms_public:/var/www/html/public:ro
      - cms_storage:/var/www/html/storage:ro

volumes:
  cms_public:
  cms_storage:
